name: 自动打包 Electron 为 EXE

on:
  push:
    branches: [ "main" ] # 往 main 分支推送代码时自动触发
  workflow_dispatch:     # 允许您在 GitHub 页面上手动点击按钮触发

jobs:
  build-windows:
    runs-on: windows-latest # 在云端 Windows 环境下打包

    steps:
    # 1. 拉取源代码
    - name: 拉取源代码
      uses: actions/checkout@v4

    # 2. 配置 Node.js 22 最新版环境
    - name: 配置 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # 3. 安装项目全部依赖
    - name: 安装项目依赖
      run: npm install

    # 4. 💡 终极解决：使用项目的专属打包命令 build:win 生成 exe 文件
    - name: 编译并打包 Windows EXE
      run: npm run build:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 5. 上传打包好的 EXE 文件
    - name: 上传打包好的 EXE 文件
      uses: actions/upload-artifact@v4
      with:
        name: CeruMusic-Windows-EXE
        path: |
          dist/*.exe
          release/*.exe

name: 自动打包 Electron 为 EXE

on:
  push:
    branches: [ "main" ] # 往 main 分支推送代码时自动触发
  workflow_dispatch:     # 允许您在 GitHub 页面上手动点击按钮触发

jobs:
  build-windows:
    runs-on: windows-latest # 💡 核心：在云端 Windows 环境下打包

    steps:
    # 1. 拉取源代码
    - name: 拉取源代码
      uses: actions/checkout@v3

    # 2. 配置 Node.js 环境（Electron 依赖 Node）
    - name: 配置 Node.js 环境
      uses: actions/setup-node@v3
      with:
        node-version: 18 # 推荐使用稳定的 Node 18 版本

    # 3. 安装依赖库
    - name: 安装项目依赖
      run: npm install

    # 4. 执行 Electron 打包命令
    # 💡 提示：这会根据您项目 package.json 中配置的打包脚本（通常是 npm run build 或 npm run dist 等）在云端进行编译
    - name: 编译并打包 Electron
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 授权打包工具在需要时发布

    # 5. 将生成的 .exe 存入归档供您下载
    - name: 上传打包好的 EXE 文件
      uses: actions/upload-artifact@v3
      with:
        name: CeruMusic-Windows-EXE
        path: |
          dist/*.exe
          release/*.exe
          # electron-builder 打包生成的 exe 默认会在 dist 或 release 文件夹下
